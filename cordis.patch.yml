# dsh-gemini-web bundle patch — 把 Gemini 网页端 provider 插件插入 DSH 组合
#
# 安装：插件已加入 ~/.dsh/profiles/web/package.json 的 dsh.profile.bundles，
# 重启 DSH Desktop 后本 patch 会自动插入下面这个插件条目。
- insert:
    - id: gemini-web
      name: 'dsh-gemini-web'
      config:
        # 其余配置项（端口 / 代理 / 浏览器路径 / 保活）在「设置 → 插件 → Gemini 网页端」里调整
        enabled: true
